title: Shadow Copies Deleted
id: 5d2c1f7a-0004-4a01-9a01-000000000004
status: test
description: vssadmin deletes volume shadow copies, an inhibitor that precedes ransomware encryption.
references:
  - https://attack.mitre.org/techniques/T1490/
author: Course reference solution
date: 2026-10-30
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: vssadmin.exe
    CommandLine|contains: delete shadows
  condition: selection
falsepositives:
