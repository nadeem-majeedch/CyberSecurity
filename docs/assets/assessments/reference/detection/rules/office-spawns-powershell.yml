title: Office Application Spawns PowerShell
id: 5d2c1f7a-0001-4a01-9a01-000000000001
status: test
description: A Word or Excel process starts PowerShell, the execution pattern of a macro dropper.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Course reference solution
date: 2026-10-30
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: powershell.exe
    ParentImage|endswith:
      - winword.exe
      - excel.exe
  condition: selection
falsepositives:
  - A signed Office add-in that deliberately launches a PowerShell helper (rare; verify the add-in).
level: high
tags:
  - attack.execution
  - attack.t1059.001
