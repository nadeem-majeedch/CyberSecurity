site_name: Cyber Security — Self-Study Program
site_description: A safety-first, self-paced cybersecurity curriculum from foundations to capstone, taught at PUCIT, University of the Punjab.
site_author: Engr. Dr. Muhammad Nadeem Majeed
# Base URL for canonical links and sitemap.xml. This is the address GitHub Pages assigns to this
# project site. Change it to the custom domain if one is ever configured. It does not publish anything.
site_url: https://nadeem-majeedch.github.io/CyberSecurity/
repo_url: https://github.com/nadeem-majeedch/CyberSecurity
repo_name: nadeem-majeedch/CyberSecurity
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

